name: Build Kernel (KernelSU-Next)

# This workflow belongs in lingtian152/android_kernel_oneplus_sm8250.
# The kernel tree has symlinks into the matching OnePlus vendor repository,
# so it is assembled as <root>/kernel/msm-4.19 plus <root>/vendor.

on:
  pull_request:
    branches:
      - lingtian152-patch-1
  push:
    branches:
      - lingtian152-patch-1
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig relative to arch/arm64/configs/"
        default: "vendor/kona-perf_defconfig"
        required: true
        type: string
      ksu_ref:
        description: "KernelSU-Next legacy commit/ref (default: 0b17f242)"
        default: "0b17f242"
        required: true
        type: string

permissions:
  contents: write

env:
  ARCH: arm64
  DEFCONFIG: ${{ inputs.defconfig || 'vendor/kona-perf_defconfig' }}
  KSU_REF: ${{ inputs.ksu_ref || '0b17f242' }}
  MODS_REPO: https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
  MODS_BRANCH: oneplus/sm8250_u_14.0.0_op8t
  CLANG_REPO: https://github.com/kdrag0n/proton-clang
  AK3_REPO: https://github.com/osm0sis/AnyKernel3

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev cpio lz4 zip unzip \
            ccache python3 dwarves device-tree-compiler xz-utils curl git \
            binutils-aarch64-linux-gnu

      - name: Cache kernel compiler results
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Cache Proton Clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          # Bump v1 when intentionally refreshing the upstream toolchain.
          key: proton-clang-${{ runner.os }}-v1

      - name: Checkout kernel into <root>/kernel/msm-4.19
        uses: actions/checkout@v4
        with:
          path: root/kernel/msm-4.19
          fetch-depth: 1

      - name: Fetch OnePlus vendor tree (symlink targets + techpack)
        run: |
          git clone --depth=1 --filter=blob:none --sparse -b "$MODS_BRANCH" "$MODS_REPO" mods
          git -C mods sparse-checkout set vendor kernel/msm-4.19/techpack
          mkdir -p root/vendor root/kernel/msm-4.19/techpack
          cp -a mods/vendor/. root/vendor/
          cp -a mods/kernel/msm-4.19/techpack/. root/kernel/msm-4.19/techpack/
          python3 root/kernel/msm-4.19/ksu-compat/fix-driver-prototypes.py \
            root/vendor root/kernel/msm-4.19/techpack
          cd root/kernel/msm-4.19
          bad=0
          while IFS= read -r f; do
            [ -e "$f" ] || { echo "broken symlink: $f -> $(readlink "$f")"; bad=1; }
          done < <(git ls-files -s | awk '$1==120000 {print $4}')
          [ "$bad" = 0 ] || { echo "::error::vendor tree incomplete"; exit 1; }

      - name: Fetch toolchain (Proton Clang)
        run: |
          if [ ! -x "$HOME/clang/bin/clang" ]; then
            git clone --depth=1 "$CLANG_REPO" "$HOME/clang"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Integrate KernelSU-Next
        working-directory: root/kernel/msm-4.19
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s "$KSU_REF"
          test -L drivers/kernelsu || { echo "::error::drivers/kernelsu missing"; exit 1; }
          git -C KernelSU-Next log -1 --oneline
          python3 "$GITHUB_WORKSPACE/root/kernel/msm-4.19/ksu-compat/adapt.py" KernelSU-Next

      - name: Generate .config
        working-directory: root/kernel/msm-4.19
        run: |
          MK="make O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          $MK "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/kb2005_sukisu_bbr.config
          scripts/config --file out/.config \
            -e KSU -e KSU_MANUAL_HOOK -e UFSFEATURE -e UFSTW \
            -e DUMP_TASKS_MEM -e PROCESS_RECLAIM_ENHANCE
          $MK olddefconfig
          grep -E 'CONFIG_(KSU|KSU_MANUAL_HOOK|KPROBES|KRETPROBES|KALLSYMS_ALL|LOCALVERSION)[=A-Z_]*' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_UFSFEATURE=y$' out/.config
          grep -q '^CONFIG_UFSTW=y$' out/.config
          grep -q '^CONFIG_DUMP_TASKS_MEM=y$' out/.config
          grep -q '^CONFIG_PROCESS_RECLAIM_ENHANCE=y$' out/.config

      - name: Build kernel
        working-directory: root/kernel/msm-4.19
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_COMPILERCHECK=content
          ccache --max-size=5G
          make -j"$(nproc)" O=out \
            CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          test -f out/arch/arm64/boot/Image

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 "$AK3_REPO" ak3
          cp root/kernel/msm-4.19/out/arch/arm64/boot/Image ak3/Image
          rm -rf ak3/.git ak3/.github
          sed -i 's/^kernel.string=.*/kernel.string=KernelSU-Next kernel for OnePlus sm8250/' ak3/anykernel.sh || true
          sed -i 's/^device.name1=.*/device.name1=OnePlus8T/;s/^device.name2=.*/device.name2=kebab/' ak3/anykernel.sh || true
          (cd ak3 && zip -r9 "../KSUNext-sm8250-$(date +%Y%m%d-%H%M).zip" . -x '*.git*')

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ksunext-sm8250-kernel
          path: |
            KSUNext-sm8250-*.zip
            build.log
            root/kernel/msm-4.19/out/.config
