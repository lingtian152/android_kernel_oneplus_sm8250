name: OnePlus 8T KB2005 kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel branch or commit
        required: true
        default: lингtian152-patch-1
        type: string
      defconfig:
        description: Defconfig path/name relative to arch/arm64/configs
        required: true
        default: vendor/kebab_defconfig
        type: string
      sukisu_branch:
        description: SukiSU Ultra integration branch
        required: true
        default: main
        type: choice
        options: [main, builtin]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev lz4 python3 python-is-python3 rsync cpio dwarves clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler
      - name: Validate defconfig
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          cfg="arch/arm64/configs/${DEFCONFIG}"
          if [ ! -f "$cfg" ]; then
            echo "::error::Defconfig not found: $cfg"
            find arch/arm64/configs -type f \( -iname '*kebab*' -o -iname '*sm8250*' \) -print || true
            exit 1
          fi
      - name: Integrate SukiSU Ultra
        env:
          SUKISU_BRANCH: ${{ inputs.sukisu_branch }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh -o /tmp/sukisu-setup.sh
          bash /tmp/sukisu-setup.sh "${SUKISU_BRANCH}"
      - name: Configure kernel and BBR
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          make ARCH=arm64 O=out "${DEFCONFIG##*/}"
          scripts/config --file out/.config --enable CONFIG_KPROBES --enable CONFIG_KRETPROBES --enable CONFIG_EXT4_FS --enable CONFIG_KSU --enable CONFIG_TCP_CONG_ADVANCED --enable CONFIG_TCP_CONG_BBR --enable CONFIG_NET_SCH_FQ
          make ARCH=arm64 O=out olddefconfig
          grep -E '^(CONFIG_(KPROBES|KRETPROBES|EXT4_FS|KSU|TCP_CONG_ADVANCED|TCP_CONG_BBR|NET_SCH_FQ))=' out/.config || true
          grep -q '^CONFIG_TCP_CONG_BBR=y$' out/.config
          grep -q '^CONFIG_NET_SCH_FQ=y$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
      - name: Build kernel image
        run: |
          set -euo pipefail
          make -j"$(nproc)" ARCH=arm64 O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 Image.gz dtbs
      - name: Verify output and config
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image.gz
          cp out/.config out/kernel.config
          file out/arch/arm64/boot/Image.gz
          sha256sum out/arch/arm64/boot/Image.gz
      - name: Upload build artifacts (not a flashable zip)
        uses: actions/upload-artifact@v4
        with:
          name: oneplus8t-kb2005-kernel-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/kernel.config
          if-no-files-found: error
          retention-days: 14
